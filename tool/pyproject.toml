[project]
name = "picolog"
version = "0.1.0"
description = "Ingest, decode, and store U4B-style WSPR pico balloon telemetry"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["picolog"]

[tool.setuptools.package-data]
picolog = ["channels_20m.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Channels 206 and 348 are publicly registered on the Traquito Channel Map.
# Per repo hard guards, nothing here pre-announces a launch: launch_utc,
# launch_lat, and launch_lon are only filled in after the fact, and flights
# stay inactive until they are actually in the air.

# Launched 2026-08-29, heard 18:40-20:20 UTC, then silent. Left inactive: it

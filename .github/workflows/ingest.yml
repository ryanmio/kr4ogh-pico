name: ingest

# Refresh the flight data committed under src/data/, which the site
# bundles into each page so a visitor sees the balloon on first paint.
#
# This job is deliberately NOT on the critical path for liveness. The page
# queries wspr.live directly in the visitor's browser for anything newer than
# the committed track, so if this workflow runs late, fails, or never runs at
# all, the site is still current -- it just takes one extra second to get
# there. That is why a daily cron is enough and why nothing here holds a
# secret: the export reads a public data source and writes a public file.

on:
  schedule:
    # Once a day. This is not the liveness path -- the browser queries
    # wspr.live itself, so the site is current no matter when this last ran.
    # All this job has to do is keep the committed track fresh enough that
    # the browser's catch-up window still reaches it, which is a question of
    # days, not minutes.
    #
    # It ran every 30 minutes when the site depended on a cache. That is 48
    # commits a day of pure noise for no benefit. (They are authored by
    # github-actions[bot], so they never counted toward anyone's contribution
    # graph, but the history is the operator's to read.)
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet ./tool

      # Throwaway database: this run only refreshes the committed export. The
      # authoritative record is the operator's local SQLite file.
      - name: Pull the last hour of spots
        run: >
          python -m picolog.run
          --flights flights.toml
          --db "$RUNNER_TEMP/ingest.db"
          --window-hours 26

      # A day's window, matching the cron. The export MERGES into the
      # committed track, so this database extends a long flight rather than
      # truncating it to what one run happened to see.
      - name: Export the site's flight data
        run: >
          python -m picolog.export_site
          --flights flights.toml
          --db "$RUNNER_TEMP/ingest.db"
          --site .

      - name: Commit any change
        run: |
          if git diff --quiet -- src/data; then
            echo "no new telemetry"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          # No [skip ci]: the deploy is the point -- it is what refreshes the
          # track bundled into the deployed page.
          git commit -m "flight data: refresh committed track"
          git push

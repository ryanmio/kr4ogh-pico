# Build /site and deploy it to GitHub Pages. Pages on a private repo needs a
# paid plan, so this stays dormant until the repo goes public — enable Pages
# with "GitHub Actions" as the source, then this deploys on every push.
#
# PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY come from repository
# *variables* (Settings > Secrets and variables > Actions > Variables): the
# anon key is public by design (RLS grants SELECT only) and a variable keeps
# it visible. Leave them unset and the site builds fully static — archived
# flights work, the live section reports the cache as not configured.

name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

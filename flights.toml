# flights.toml -- this site and its flights, in one file.
#
# This is the only file to edit to run the site for your own callsign: see
# README.md, "Fly your own". The site reads it at build time and the ingest
# tool reads it too, so the two never disagree about what is flying. A
# mistake here fails the build with a message that names the field.

[site]
# Shown in the header, page titles and share cards. Nothing else about the
# site is named after a callsign.
callsign = "KR4OGH"
# Optional: the flight the home page shows. Any flight on the site can be
# reached at /?feature=<flight_id>; this is the one shown when the address
# names none. Left out, the home page shows the live flight that launched
# first.
featured = "F2B"
# Optional: where the site is served, e.g. "https://n0call-pico.vercel.app".
# Vercel fills this in by itself, so it is only needed for a deploy
# elsewhere. Share cards need it: og:image and canonical are absolute URLs.
# url = ""
# Optional: the "Source & data" link. Vercel fills this in from the repo it
# is deploying, so set it only to point somewhere else.
# repo = ""

# One [[flights]] entry per flight. Fields:
#
#   flight_id   short id, unique here, used in the URL: /live/<flight_id>/
#   callsign    the callsign the tracker transmits
#   band        "20m" (the only band supported so far)
#   channel     the Traquito channel the tracker is configured for, 0-599
#   active      true while the flight is up; false hides it from the site
#   launch_utc  "YYYY-MM-DD HH:MM:SS", UTC. When the balloon was first heard.
#               The site shows it, and the ingest tool's --from-launch run
#               fetches history back to it. Fill it in after launch, not
#               before: the site is not the place to announce one.
#   launch_lat, launch_lon   optional, draws the launch point on the map
#   end_utc     same form, optional. When the flight was last heard, or
#               when you declared it over. Nothing heard after it is
#               attributed to this flight. Needed when a later flight
#               reuses the channel: without it the two are the same
#               callsign on the same channel, and telemetry from the new
#               one would be added to the old one's track.
#   status      "live" (default) or "closed" once the flight is over. A
#               closed flight keeps its page and its track, stops being
#               polled, and reads as ended.
#   close_reason   optional note on why it closed
#
# An optional [flights.tracker] table right after a flight holds build
# details for the Tracker panel: any labels you like, in the order written.

# Launched 2026-08-29, heard 18:40-20:20 UTC, then silent. Left inactive so
# it stays off the site; flip active on only if it is heard again.
[[flights]]
flight_id = "F1A"
callsign = "KR4OGH"
band = "20m"
channel = 206
active = false
launch_utc = "2026-08-29 18:40:00"

# First heard 2026-08-30 12:44 UTC, last heard 2026-09-01 11:04 UTC. Closed
# with an end so that F2B, on the same channel, is its own flight.
[[flights]]
flight_id = "F1B"
callsign = "KR4OGH"
band = "20m"
channel = 348
active = false
launch_utc = "2026-08-30 12:44:00"
end_utc = "2026-09-01 12:00:00"
status = "closed"
close_reason = "Silent since 2026-09-01 11:04 UTC"

